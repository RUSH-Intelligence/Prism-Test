# ============================================================================
# Verified KV compression (v1) — Qwen3.5-9B (hybrid attention)
# ============================================================================
# VerifiedSketch wraps an inner compressor (Ridge here) and splits the kept
# budget: det_fraction (0.75) is filled by Ridge's top-k, the rest by uniform
# random sampling from the tokens Ridge evicted. Same total budget as plain
# Ridge; decode is unchanged. See notes/verified_kv_compression_idea.md.
#
# This is the v1 skeleton toward the vAttention-style verified bound — NO
# Horvitz-Thompson reweighting / (eps, delta) certificate yet.
#
# Sweep det_fraction to trade the deterministic head against the random tail;
# 1.0 == plain Ridge, 0.0 == pure uniform-random eviction.
#
#   python -m eval_harness.cli run --config_file ./evaluate/evaluate_kv_verified.yaml
#   # or override the split on the CLI without editing the file:
#   python -m eval_harness.cli run --config_file ./evaluate/evaluate_kv_verified.yaml \
#       --benchmark ruler16k --subsets niah_single_1

benchmark: ruler16k
subsets: niah_single_1,niah_single_3,niah_multikey_3

backend: research

model: Qwen/Qwen3.5-9B

# Runtime
tensor_parallel_size: 1
dtype: bfloat16
max_model_len: 131072
gpu_memory_utilization: 0.9
trust_remote_code: true
enable_prefix_caching: true

# Generation
max_new_tokens: null
temperature: 0.0
top_p: 1.0
system_prompt: null
seed: 42

# Evaluation limits (max_requests applies PER SUBSET — runner.py:79)
max_requests: 200
fraction: 1.0
query_aware: false

output_dir: ./results/kv_verified

llm_kwargs:
  attn_implementation: sdpa

  research_config:
    kv_compressor: verified
    kv_compressor_kwargs:
      inner: ridge
      det_fraction: 0.75
      # inner_kwargs: {}          # forwarded to RidgeSketch if you want to tune it
      sample_seed: 42
    compression_ratio: 0.8
    compression_schedule: post_prefill
    max_context_length: null
    log_cache_seq_len: true

    attention_method: none
    attention_method_kwargs: {}
