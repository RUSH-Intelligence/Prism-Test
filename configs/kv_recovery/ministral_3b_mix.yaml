# ============================================================================
# Hidden-state KV recovery — MIXED distillation corpus (RULER/LongBench rows outside the evaluated pool + PG-19 + FineWeb-Edu) — Ministral-3-3B-Instruct-2512 (default run card)
# ============================================================================
#   python scripts/train_kv_recovery.py --config configs/kv_recovery/ministral_3b.yaml \
#       [--run-name NAME] [--set a.b.c=value ...] [--learning-rate 1e-5]
#       [--trainable-last-n-blocks 1 | --trainable-attention-projections q_proj,o_proj]
#       [--trainable-layers sensitivity --sensitivity-top-k 4 | --trainable-layers last_n:4]
#       [--kv-compressor knorm] [--compression-ratio 0.75 | --kv-budget-ratio 0.25]
#       [--max-length 16384] [--suffix-length 512] [--num-train-examples 256]
#
# Teacher = this model with a FULL KV cache; student = the same weights with the
# `kv_compression` block below installed exactly as the research backend installs
# it for evaluation. ONE `kv_compression` block feeds the student, the delta
# checkpoint metadata and the compressed / compressed_recovered eval arms.
# Unknown keys anywhere in this file are an error.

run_name: ministral3b_mix16k_knorm_r075_qo_sens4
seed: 42                 # python / numpy / torch / cuda (EvalRunner._set_seed)
deterministic: true      # EvalRunner._enable_determinism (pair with CUBLAS_WORKSPACE_CONFIG=:4096:8)

model:
  name: mistralai/Ministral-3-3B-Instruct-2512
  revision: null         # recorded + checked against the loaded snapshot when set
  dtype: bfloat16
  attn_implementation: sdpa     # the research backend's validated path; same in every eval arm
  trust_remote_code: true
  max_model_len: 131072
  dequantize_fp8: true          # Ministral-3 ships FP8; stream to BF16 at load (HFAdapter)

# Door 3 only (attention_method / positional_method stay "none").
kv_compression:
  kv_compressor: knorm          # any registered compressor; matrix: knorm | cur
  compression_ratio: 0.75       # fraction of the context KV PRUNED per head; kept = int(T*(1-r))
  kv_compressor_kwargs: {}      # e.g. cur: {num_sinks: 4}
  compression_schedule: null    # null = the compressor's default (post_prefill = compress once after the context)
  prefill_chunk_size: null      # null = single-pass prefill (the eval default)

data:
  path: data/kv_recovery/mix16k_train.jsonl     # scripts/prepare_kv_recovery_mix.py: RULER rows 120-199 + LongBench rows 100-199 + PG-19 + FineWeb-Edu
  val_path: data/kv_recovery/mix16k_val.jsonl   # RULER rows 100-119, LongBench held-out rows, PG-19 test books, other FineWeb docs
  max_length: 16384             # context + suffix tokens
  suffix_length: 512            # tokens processed AFTER compression = the aligned segment
  num_train_examples: 1024          # 256 optimizer steps at grad_accum 4
  num_val_examples: 32
  seed: 42
  format: raw                   # raw = bos + text; chat = ResearchGenerationPipeline.preprocess
  suffix_mode: continuation     # continuation | recall (pre-registered ablation)
  strip_auto_system_block: true # chat format and qa rows
  qa_region: question_answer    # qa rows: align the question + answer prefix + gold answer (teacher-forced)
  max_context_tokens: 16384     # qa rows with a longer context are skipped (keeps the corpus at the window length)

alignment:
  layers:
    strategy: from_first_trainable   # last_n | explicit | all | from_first_trainable
    n: 4
    indices: null
  include_final_norm: true           # also align the post-`norm` output (the lm_head input)
  positions:
    strategy: all                    # all | recent | first_k | post_eviction (== all under post_prefill)
    n: 128
  loss: normalized_mse               # normalized_mse | normalized_mse_elementwise | cosine | relative_mse
  layer_weights: null
  allow_dead_terms: false            # aligned layers upstream of every trainable param carry no gradient

loss:
  hidden_weight: 1.0
  kl_weight: 0.0                     # optional T^2 * KL(teacher || student) on the same positions
  temperature: 1.0

trainable:
  strategy: attention_projections    # last_n_blocks | blocks | attention_projections | mlp | norms | full
  n: 1                               # last_n_blocks only
  modules: [q_proj, o_proj]          # attention_projections only (the calibrated set {W_Q, W_O} of the selected layers)
  layers: sensitivity                # attention_projections / blocks / mlp / norms: all | "last_n:<k>" | [indices] | sensitivity
  include_embeddings: false
  sensitivity:                       # layers: sensitivity -> top_k layers with the largest hidden-state misalignment
    top_k: 4                         #   E_l = ||H_dense - H_comp||_F / (||H_dense||_F + eps) over the suffix tokens,
    num_examples: 16                 #   averaged over `num_examples` held-out calibration windows (val rows disjoint
    split: val                       #   from the validation windows); only K/V-carrying layers are eligible
    positions: {strategy: all, n: 128}
    eps: 1.0e-6
    aggregate: mean                  # mean | median over calibration windows

optim:
  learning_rate: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip: 1.0
  grad_accum: 4                      # batch 1 x 4 -> 64 optimizer steps per epoch of 256 examples
  epochs: 1
  max_steps: null
  warmup_fraction: 0.0
  val_every_steps: 32                # 256 steps -> 8 validations of 32 windows (every 8 would cost ~40 min per run)
  shuffle_seed: 0
  master_weights_fp32: true          # BF16 weights, FP32 masters + AdamW state (prior D10)
  deterministic_backward: false      # math SDPA backend for the grad-enabled suffix forward
  instability:
    grad_norm_factor: 10.0
    consecutive_steps: 2
    warmup_fraction: 0.05
    restart: true

teacher:
  mode: online                       # online (second model instance) | offline (precompute_teacher_states.py)
  states_dir: null
  store_dtype: bfloat16

student:
  prefill_grad: false                # true = gradients also flow through the compressed context prefill (write path)
  segment_mode: auto                 # auto | block | token_by_token

eval:
  benchmarks:
    - {benchmark: ruler16k, subsets: null, max_requests: 100, request_offset: 0, walltime: "2:30:00"}
    - {benchmark: ruler32k, subsets: null, max_requests: 100, request_offset: 0, walltime: "3:30:00"}
    - benchmark: longbench
      subsets: [narrativeqa, qasper, multifieldqa_en, hotpotqa, 2wikimqa, musique, gov_report, qmsum,
                multi_news, trec, triviaqa, samsum, passage_count, passage_retrieval_en, lcc, repobench-p]
      max_requests: 100               # rows 0-99: rows 100-199 are DISTILLATION data in the mixed corpus
      request_offset: 0
      walltime: "6:00:00"
  use_chat_template: true
  strip_auto_system_block: true      # the model's auto system prompt is NOT compressed as context (all arms)
  group_by_context: null             # null = false for hybrid (linear-attention) models, true otherwise
  results_root: null                 # default <output.root>/eval/<model_slug>; shared across runs
  dense_dir: {}                      # benchmark -> an existing dense cell to reuse (fingerprint-checked)
  bootstrap: {n_resamples: 10000, seed: 0, alpha: 0.05}
  slurm:
    partition: commons
    account: as143
    gres: gpu:h200:1
    cpus: 8
    mem_per_cpu: 32GB
    exclude: bg3u24g1
    train_time: "6:00:00"
    log_dir: /scratch/sj157/kvrec_logs

output:
  root: outputs/kv_recovery
  overwrite: false
