# ════════════════════════════════════════════════════════════════════════
# SWEEP CONFIG — edit this file, then run:   ./scripts/submit_sweep.sh
#
# Submits every combination below to SLURM: one array job per (model x
# benchmark) pair, each array running the method x ratio grid (plus the
# Ridge/Verified special grids). Preview first with:
#     ./scripts/submit_sweep.sh --dry-run
# ════════════════════════════════════════════════════════════════════════

# ── WHAT TO RUN (each a list; ALL combinations are run) ───────────────────
# Uncomment a line to add it to the sweep. Commented entries below are the
# models / benchmarks / methods / ratios we've ACTUALLY run before — toggle at will.
models:
  - meta-llama/Llama-3.1-8B-Instruct              # primary
  # - Qwen/Qwen3.5-9B                             # primary (current branch)
  # - Qwen/Qwen2.5-7B-Instruct                    # 32k-native; needs max_model_len cap (see model_overrides)
  # - mistralai/Ministral-3-3B-Instruct-2512      # needs dequantize_fp8 (see model_overrides)
  # - mistralai/Ministral-3B-Instruct-2410
  # - mistralai/Mistral-7B-Instruct-v0.2          # 32k-native; needs max_model_len cap (see model_overrides)
  # - nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16       # hybrid Mamba/attn; keep attention_method none
  # (Meta-Llama-3-8B is 8k-native — context-extension experiments only, not this KV sweep.)

benchmarks:
  # - longbench                                     # primary; subsets pinned below
  - ruler16k                                    # subsets pinned below
  # - ruler64k                                    # 64k ctx; see benchmark_overrides
  # - loft                                        # runs its own default subset list
  # - aime            # aime2024 / aime2025 also registered
  # - gsm_infinite_hard_128k    # _medium_128k / _symbolic_128k also registered

methods:                          # compressors to test (registry names; see the roster
  - knorm                       # in example_research.yaml / available_kv_compressors)
  - snapkv
  - ridge                       # fans out via the `ridge:` special grid below
  - compactor                   # prefill-only scorer; keep prefill_chunk_size null
  - cur
  # - pyramidkv                   # ragged cache -> needs flash_attention_2
  # - expected_attention
  # - keydiff
  # - streaming_llm
  # - top_k_sampling
  # - verified                      # det_fraction 1.0 = plain-ridge picks + coverage logging

ratios:                           # fraction PRUNED (kept = 1 - ratio). Comment/uncomment.
  - 0.6
  - 0.8
  - 0.9
  # - 0.95
  # - 0.2
  # - 0.4

full_baseline: true               # also run ONE no-compression cell per (model,benchmark)

# ── SPECIAL PER-METHOD SWEEPS ─────────────────────────────────────────────
# Only fire if the method is in `methods:` above. Commented = use the method's
# single default. Uncomment a list to fan it out into extra cells (all
# combinations). `verified` wraps `inner` and reuses the Ridge dials for it.
ridge:
  gammas:         [0, 0.5, 1, 1.5, 2, 2.5, 3]   # envelope_gamma
  # lambdas:        [1.0e-4]                        # ridge_lambda
  # rotate_queries: [false]
  # sink_size:      8
  # local_size:     64

verified:
  det_fractions:  [1.0]         # 1.0 = plain-ridge selection (no random tail) + coverage
  inner:          ridge
  measure_coverage: true        # LOG-ONLY output-error per layer (changes nothing kept).
  # det_fractions:  [1.0, 0.9, 0.8, 0.7, 0.5, 0.0]   # widen later to test the split itself

# ── MODEL SIDE-TABLE (only the oddballs; others use the defaults below) ────
# A model not listed here uses sweep_base.yaml + the shared defaults as-is.
# Per-model quirks go here as a few lines — no model ever needs its own file.
# Keys: max_model_len, llm_kwargs (special load flags), template (rarely needed).
model_overrides: {}
  # --- sub-128k models: cap max_model_len or 128k places OOD positions ---
  # mistralai/Mistral-7B-Instruct-v0.2:
  #   max_model_len: 32768        # 32k-native
  # Qwen/Qwen2.5-7B-Instruct:
  #   max_model_len: 32768        # 32k-native (prior ruler16k-only run used 18000)
  # --- FP8 checkpoint: stream to BF16 for apples-to-apples ---
  # mistralai/Ministral-3-3B-Instruct-2512:
  #   llm_kwargs:
  #     dequantize_fp8: true      # the ONE thing Ministral needs (FP8 -> BF16)

# ── BENCHMARK SIDE-TABLE (per-benchmark subsets / length) ──────────────────
# A benchmark NOT listed here runs its own full default subset list. LongBench's
# default is 34 tasks (incl. Chinese + `_e`); we pin it to the paper's 16 English
# tasks so numbers match the Ridge Press sheet / prior sweeps. Remove/edit freely.
benchmark_overrides:
  # longbench:
  #   subsets: [narrativeqa, qasper, multifieldqa_en, hotpotqa, 2wikimqa, musique,
  #             gov_report, qmsum, multi_news, trec, triviaqa, samsum,
  #             passage_count, passage_retrieval_en, lcc, repobench-p]
  ruler16k:
    subsets: [cwe, fwe, niah_multikey_1, niah_multikey_2, niah_multikey_3,
              niah_multiquery, niah_multivalue, niah_single_1, niah_single_2,
              niah_single_3, qa_1, qa_2, vt]
  # ruler64k:
  #   max_model_len: 66000

# ── SHARED DEFAULTS ───────────────────────────────────────────────────────
template: evaluate/sweep_base.yaml     # generic base card all cells start from
max_model_len: 131072
max_requests: 200
# subsets: null   # global default subsets; null = each benchmark's own list

# ── SLURM ─────────────────────────────────────────────────────────────────
slurm:
  partition: scavenger
  qos: scavenger
  account: scavenger
  gpu: rtxa6000
  cpus: 8
  mem: 64G
  time: "12:00:00"

# ── ENVIRONMENT (per-cluster — edit to match YOUR machine) ────────────────
# The settings that differ from cluster to cluster. The launcher
# (scripts/sweep.sbatch) reads these from here, so you never have to edit that
# script — just change the values below. Leave a field out (or empty) to skip
# it. Defaults match this repo's Nexus setup.
env:
  venv: .venv                 # Python env to activate (relative to repo root, or absolute)
  modules:                    # `module load` these first (names are cluster-specific)
    - cuda/13.0.2
    - gcc/15.1.0
  ld_preload:                 # force-load these shared libs FIRST; PREPENDED, so
    - /opt/local/stow/gcc-15.1.0/lib64/libstdc++.so.6   # any lib the cluster already
                                                        # preloaded (e.g. xalt) is kept
  ld_library_path:            # extra dirs prepended to the library search path (optional)
    - /opt/local/stow/gcc-15.1.0/lib64
